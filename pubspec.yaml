name: abrova_push
description: Real-time push notifications, in-app messages, inbox, A/B testing, and more for Flutter apps on Android, iOS and the web. No Firebase dependency.
version: 0.1.35
homepage: https://abrova.ir/cloud/abrova-push
repository: https://github.com/Abrova-co/abrova_push_flutter_sdk

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: ir.abrova.push.flutter
        pluginClass: AbrovaPushPlugin
      ios:
        pluginClass: AbrovaPushPlugin
      web:
        pluginClass: AbrovaPushWeb
        fileName: src/web/abrova_push_web.dart
  assets:
    - assets/web/abrova-push-web.js
